name: Build Story AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          echo "===== SDKMANAGER ====="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Buildozer SDK Manager Path
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk

          mkdir -p $ANDROID_HOME/tools/bin

          rm -f $ANDROID_HOME/tools/bin/sdkmanager

          ln -s \
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            $ANDROID_HOME/tools/bin/sdkmanager

          echo "===== BUILDOZER SDKMANAGER ====="
          ls -l $ANDROID_HOME/tools/bin/sdkmanager
          $ANDROID_HOME/tools/bin/sdkmanager --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryAI-APK
          path: bin/*.apk

      - name: Upload Error Log
        if: failure()
        run: |
          echo "===== BUILD FAILED ====="
          find . -name "*.log" -type f -maxdepth 6 -print
