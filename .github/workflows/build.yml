name: Build Story AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Check Project Files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec
          echo "===== MAIN.PY ====="
          cat main.py

      - name: Build APK
        run: |
          echo "===== BUILD STARTED ====="
          set -o pipefail
          buildozer android debug 2>&1 | tee build-error.log

      - name: Show Error Log
        if: failure()
        run: |
          echo "======================================"
          echo "          BUILD FAILED"
          echo "======================================"
          echo "===== ERROR LOG ====="
          cat build-error.log
          echo "======================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryAI-APK
          path: bin/*.apk

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StoryAI-Build-Error
          path: build-error.log
